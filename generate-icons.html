<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="c192" width="192" height="192"></canvas>
<script>
function drawIcon(canvasId, size, radius){
  var c = document.getElementById(canvasId);
  var ctx = c.getContext("2d");
  // Background oranye rounded
  ctx.beginPath();
  ctx.moveTo(radius,0);
  ctx.lineTo(size-radius,0);
  ctx.quadraticCurveTo(size,0,size,radius);
  ctx.lineTo(size,size-radius);
  ctx.quadraticCurveTo(size,size,size-radius,size);
  ctx.lineTo(radius,size);
  ctx.quadraticCurveTo(0,size,0,size-radius);
  ctx.lineTo(0,radius);
  ctx.quadraticCurveTo(0,0,radius,0);
  ctx.closePath();
  ctx.fillStyle="#f97316";
  ctx.fill();
  // Mobil emoji
  ctx.font = (size*0.52)+"px serif";
  ctx.textAlign="center";
  ctx.fillText("🚗", size/2, size*0.65);
  // Teks WAS
  ctx.fillStyle="white";
  ctx.font="bold "+(size*0.12)+"px Arial";
  ctx.fillText("WAS Garage", size/2, size*0.88);
}
drawIcon("c512",512,96);
drawIcon("c192",192,36);

// Download otomatis
setTimeout(function(){
  var a = document.createElement("a");
  a.download = "icon-512.png";
  a.href = document.getElementById("c512").toDataURL("image/png");
  a.click();
  setTimeout(function(){
    a.download = "icon-192.png";
    a.href = document.getElementById("c192").toDataURL("image/png");
    a.click();
  },500);
},300);
</script>
</body></html>
